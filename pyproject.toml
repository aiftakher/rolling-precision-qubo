[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rolling-precision-qubo"
version = "0.1.0"
description = "Encode bounded mixed-integer problems as QUBO and reproduce rolling-precision QUBO paper examples."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ashfaq Iftakher"}]
keywords = ["QUBO", "mixed-integer optimization", "D-Wave", "simulated annealing"]
dependencies = [
  "dimod>=0.12",
  "dwave-neal>=0.6",
  "numpy>=1.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dwave = [
  "dwave-system>=1.25",
  "dwave-hybrid>=0.6",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
rpqubo = "rpqubo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["legacy", "notebooks", "papers", "data", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
packages = ["rpqubo"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
