[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rolling-precision-qubo"
version = "0.1.0"
description = "Encode bounded mixed-integer problems as QUBO and reproduce rolling-precision QUBO paper examples."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ashfaq Iftakher"}]
keywords = ["QUBO", "mixed-integer optimization", "D-Wave", "simulated annealing"]
dependencies = [
  "dimod>=0.12",
  "dwave-neal>=0.6",
  "numpy>=1.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.15,<0.16",
  "mypy>=1.19,<1.20",
]

[project.scripts]
rpqubo = "rpqubo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "notebooks", "papers", "data", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "UP007"]

[tool.mypy]
python_version = "3.10"
packages = ["rpqubo"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: seeded paper-reference and sensitivity regeneration tests",
]
