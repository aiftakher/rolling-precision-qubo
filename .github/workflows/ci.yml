name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/rpqubo
      - name: Tests
        run: pytest -q -m "not slow"

  reference-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-lock.txt -e ".[dev]"
          python -m pip check
      - name: Slow paper-reference tests
        run: pytest -q -m slow
      - name: Regenerate paper outputs
        run: rpqubo reproduce-paper --example all --output-dir outputs/paper --strict
      - name: Upload paper outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper-outputs
          path: outputs/paper
